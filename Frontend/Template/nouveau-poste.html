<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SportForum — Feed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .nav-link { display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:8px; margin-bottom:4px; text-decoration:none; color:#374151; transition:background 0.15s; }
    .nav-link:hover { background:#f3f4f6; }
    .nav-link.active { background:#eff6ff; color:#2563eb; }
    .fab { position:fixed; bottom:24px; right:24px; width:56px; height:56px; background:#111827; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,0.25); transition:all 0.3s ease; overflow:hidden; white-space:nowrap; border:none; }
    .fab:hover { width:180px; border-radius:28px; }
    .fab-icon { flex-shrink:0; width:56px; height:56px; display:flex; align-items:center; justify-content:center; }
    .fab-label { color:white; font-size:14px; font-weight:600; padding-right:16px; opacity:0; transition:opacity 0.2s; }
    .fab:hover .fab-label { opacity:1; }
    .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:50; align-items:center; justify-content:center; }
    .modal-bg.open { display:flex; }
  </style>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-gray-200 flex flex-col flex-shrink-0">
    <div class="p-6">
      <h1 class="font-bold text-2xl text-gray-900">SportForum</h1>
      <p class="text-sm text-gray-500">Votre communauté sportive</p>
    </div>
    <nav class="flex-1 px-3">
      <a href="feed.html" class="nav-link active">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Feed d'actualité
      </a>
      <a href="tendance.html" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        En tendance
      </a>
      <a href="decouvrir.html" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        Découvrir
      </a>
      <a href="suivis.html" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        Mes suivis
      </a>
      <hr class="my-4 border-gray-200"/>
      <a href="parametres.html" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        Paramètres
      </a>
      <a href="connexion.html" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
        Connexion
      </a>
    </nav>
    <div class="p-4 border-t border-gray-200">
      <div class="flex items-center gap-3">
        <div id="sidebar-avatar" class="w-9 h-9 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center text-white font-bold text-sm">?</div>
        <div>
          <p id="sidebar-name" class="text-sm font-semibold text-gray-900">Non connecté</p>
          <p id="sidebar-email" class="text-xs text-gray-500"></p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 overflow-auto">
    <div class="max-w-2xl mx-auto py-8 px-4">
      <h2 class="text-3xl font-bold text-gray-900 mb-2">Feed d'actualité</h2>
      <p class="text-gray-500 mb-8">Les dernières publications de votre communauté</p>

      <!-- Quick post bar -->
      <div class="bg-white rounded-xl border border-gray-200 p-4 mb-6 flex items-center gap-3 cursor-pointer hover:border-blue-300 transition-colors" onclick="openModal()">
        <div id="quick-avatar" class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center text-white font-bold flex-shrink-0">?</div>
        <div class="flex-1 bg-gray-100 rounded-full px-4 py-2 text-gray-400 text-sm">Quoi de neuf dans le sport ?</div>
      </div>

      <div id="posts-container" class="space-y-6"></div>
    </div>
  </main>

  <!-- Modal création de post -->
  <div id="modal" class="modal-bg" onclick="if(event.target===this) closeModal()">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg mx-4 p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-xl font-bold text-gray-900">Nouveau post</h3>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-500 text-lg">✕</button>
      </div>
      <div class="flex items-start gap-3 mb-4">
        <div id="modal-avatar" class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center text-white font-bold flex-shrink-0">?</div>
        <div class="flex-1">
          <p id="modal-username" class="font-semibold text-gray-900 text-sm mb-1">Utilisateur</p>
          <select id="post-sport" class="text-xs border border-gray-200 rounded-full px-3 py-1 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
            <option value="⚽ Football">⚽ Football</option>
            <option value="🏀 Basketball">🏀 Basketball</option>
            <option value="🎾 Tennis">🎾 Tennis</option>
            <option value="🏉 Rugby">🏉 Rugby</option>
            <option value="🏎️ Formule 1">🏎️ Formule 1</option>
            <option value="🚴 Cyclisme">🚴 Cyclisme</option>
            <option value="🏊 Natation">🏊 Natation</option>
            <option value="🏃 Running">🏃 Running</option>
            <option value="🏋️ Fitness">🏋️ Fitness</option>
            <option value="⛷️ Ski">⛷️ Ski</option>
          </select>
        </div>
      </div>
      <textarea id="post-content" rows="5" placeholder="Partagez votre passion sportive..." class="w-full border border-gray-200 rounded-xl px-4 py-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none text-sm" maxlength="500"></textarea>
      <div class="flex items-center justify-between mt-1 mb-4">
        <span id="char-count" class="text-xs text-gray-400">0 / 500</span>
      </div>
      <div class="flex gap-3">
        <button onclick="closeModal()" class="flex-1 py-2.5 border border-gray-200 rounded-xl text-gray-700 font-medium hover:bg-gray-50 transition-colors">Annuler</button>
        <button onclick="submitPost()" class="flex-1 py-2.5 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 transition-colors">Publier</button>
      </div>
    </div>
  </div>

  <!-- FAB -->
  <button class="fab" onclick="openModal()">
    <div class="fab-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
    </div>
    <span class="fab-label">Créer un post</span>
  </button>

  <script>
    const SAMPLE_POSTS = [
      { id: 'sample-1', author: 'Marc Dupont', sport: '⚽ Football', time: 'Il y a 2h', content: 'Incroyable match hier soir ! Le PSG a vraiment montré du caractère. Mbappé en grande forme 🔥', likes: 145, comments: 23, liked: false },
      { id: 'sample-2', author: 'Sophie Martin', sport: '🎾 Tennis', time: 'Il y a 4h', content: 'Roland-Garros approche ! Qui sont vos favoris cette année ? Moi je mise sur Alcaraz 🎾', likes: 89, comments: 34, liked: false },
      { id: 'sample-3', author: 'Thomas Bernard', sport: '🏀 Basketball', time: 'Il y a 6h', content: 'Les Warriors en pleine forme ! Curry avec 42 points, c\'est du grand spectacle 🏀', likes: 212, comments: 45, liked: false },
      { id: 'sample-4', author: 'Julie Petit', sport: '🏃 Running', time: 'Il y a 8h', content: 'Premier semi-marathon terminé en 1h45 ! Je suis tellement fière de moi 💪', likes: 178, comments: 56, liked: false },
    ];

    function getPosts() {
      const saved = localStorage.getItem('sportforum_posts');
      const userPosts = saved ? JSON.parse(saved) : [];
      return [...userPosts, ...SAMPLE_POSTS];
    }

    function getUser() {
      const u = localStorage.getItem('sportforum_user');
      return u ? JSON.parse(u) : null;
    }

    function timeAgo() { return 'À l\'instant'; }

    function initial(name) { return name ? name.charAt(0).toUpperCase() : '?'; }

    function avatarColors(name) {
      const colors = [
        'from-blue-500 to-purple-500', 'from-pink-500 to-rose-500',
        'from-green-500 to-teal-500', 'from-orange-500 to-amber-500',
        'from-violet-500 to-purple-500', 'from-cyan-500 to-blue-500'
      ];
      if (!name) return colors[0];
      return colors[name.charCodeAt(0) % colors.length];
    }

    function renderPosts() {
      const posts = getPosts();
      const container = document.getElementById('posts-container');
      container.innerHTML = posts.map(p => `
        <article class="bg-white rounded-xl shadow-sm border border-gray-100 p-6" id="post-${p.id}">
          <div class="flex items-start gap-4 mb-4">
            <div class="w-12 h-12 bg-gradient-to-br ${avatarColors(p.author)} rounded-full flex items-center justify-center text-white font-bold text-lg flex-shrink-0">${initial(p.author)}</div>
            <div class="flex-1">
              <div class="flex items-center justify-between">
                <div><h3 class="font-bold text-gray-900">${p.author}</h3><p class="text-sm text-gray-500">${p.sport} · ${p.time}</p></div>
                <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full">${p.sport}</span>
              </div>
            </div>
          </div>
          <p class="text-gray-800 mb-4 leading-relaxed">${p.content}</p>
          <div class="flex items-center gap-6 pt-4 border-t border-gray-100">
            <button onclick="toggleLike('${p.id}')" class="flex items-center gap-2 transition-colors ${p.liked ? 'text-red-500' : 'text-gray-500 hover:text-red-500'}" id="like-btn-${p.id}">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="${p.liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
              <span id="like-count-${p.id}">${p.likes}</span>
            </button>
            <button class="flex items-center gap-2 text-gray-500 hover:text-blue-500 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <span>${p.comments}</span>
            </button>
            <button class="flex items-center gap-2 text-gray-500 hover:text-green-500 transition-colors ml-auto">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>
              Partager
            </button>
          </div>
        </article>
      `).join('');
    }

    function toggleLike(postId) {
      const saved = localStorage.getItem('sportforum_posts');
      const userPosts = saved ? JSON.parse(saved) : [];
      const idx = userPosts.findIndex(p => p.id === postId);
      if (idx !== -1) {
        userPosts[idx].liked = !userPosts[idx].liked;
        userPosts[idx].likes += userPosts[idx].liked ? 1 : -1;
        localStorage.setItem('sportforum_posts', JSON.stringify(userPosts));
      }
      // For sample posts, handle in-memory only (re-render)
      renderPosts();
    }

    function openModal() {
      const user = getUser();
      const name = user ? user.username : 'Invité';
      document.getElementById('modal-avatar').textContent = initial(name);
      document.getElementById('modal-username').textContent = name;
      document.getElementById('post-content').value = '';
      document.getElementById('char-count').textContent = '0 / 500';
      document.getElementById('modal').classList.add('open');
      setTimeout(() => document.getElementById('post-content').focus(), 100);
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    function submitPost() {
      const content = document.getElementById('post-content').value.trim();
      if (!content) { document.getElementById('post-content').focus(); return; }
      const user = getUser();
      const sport = document.getElementById('post-sport').value;
      const newPost = {
        id: 'user-' + Date.now(),
        author: user ? user.username : 'Invité',
        sport,
        time: 'À l\'instant',
        content,
        likes: 0,
        comments: 0,
        liked: false
      };
      const saved = localStorage.getItem('sportforum_posts');
      const posts = saved ? JSON.parse(saved) : [];
      posts.unshift(newPost);
      localStorage.setItem('sportforum_posts', JSON.stringify(posts));
      closeModal();
      renderPosts();
    }

    // Char counter
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('post-content').addEventListener('input', function() {
        document.getElementById('char-count').textContent = this.value.length + ' / 500';
      });

      // Load user in sidebar
      const user = getUser();
      if (user) {
        document.getElementById('sidebar-name').textContent = user.username;
        document.getElementById('sidebar-email').textContent = user.email;
        document.getElementById('sidebar-avatar').textContent = initial(user.username);
        document.getElementById('quick-avatar').textContent = initial(user.username);
      }

      renderPosts();
    });
  </script>
</body>
</html>
