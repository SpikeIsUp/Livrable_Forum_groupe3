</head>
<body class="bg-gray-50 flex h-screen overflow-hidden">

      <h1 class="font-bold text-2xl text-gray-900">SportForum</h1>
      <p class="text-sm text-gray-500">Votre communauté sportive</p>
    </div>
    <nav class="flex-1 px-3">

      <a href="tendance.html" class="nav-link">

      <a href="decouvrir.html" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
        Découvrir
      </a>
      <a href="suivis.html" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        Mes suivis
      </a>
      <hr class="my-4 border-gray-200"/>
      <a href="parametres.html" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        Paramètres
      </a>
      <a href="connexion.html" class="nav-link active">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
        Connexion
      </a>
    </nav>
  </aside>
 
  <main class="flex-1 overflow-auto flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4 text-3xl">🏆</div>
        <h2 class="text-3xl font-bold text-gray-900">Bienvenue !</h2>
        <p class="text-gray-500 mt-2">Connectez-vous à SportForum</p>
      </div>
 
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <div class="grid grid-cols-2 gap-3 mb-6">
          <button>  <a href="google-auth.html" class="flex items-center justify-center gap-2 px-4 py-2.5 border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors text-sm font-medium">
    <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Google
</a>
          </button>
           </button> <a href="Facebook-auth.html" class="flex items-center justify-center gap-2 px-4 py-2.5 border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors text-sm font-medium">
    <svg class="w-5 h-5" fill="#1877F2" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
    Facebook
</a>
          </button>
        </div>
 
        <div class="relative mb-6">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
          <div class="relative flex justify-center text-sm"><span class="px-3 bg-white text-gray-400">ou avec votre email</span></div>
        </div>
 
        <form onsubmit="event.preventDefault(); connecterAvecEmail()" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input id="email" type="email" required placeholder="votre@email.com" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
            <input id="password" type="password" required placeholder="••••••••" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors" />
          </div>
          <div class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="rounded border-gray-300 text-blue-600" />
              <span class="text-gray-600">Se souvenir de moi</span>
            </label>
            <a href="#" class="text-blue-600 hover:underline">Mot de passe oublié ?</a>
          </div>
          <button type="submit" class="w-full py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition-colors">
            Se connecter
          </button>
        </form>
 
        <p class="text-center text-sm text-gray-500 mt-6">
          Pas encore de compte ?
          <a href="inscription.html" class="text-blue-600 font-medium hover:underline">S'inscrire</a>
        </p>
      </div>
    </div>
  </main>
 
  <!-- Modal de notification -->
  <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 shadow-xl">
      <h3 id="modal-title" class="text-xl font-bold text-gray-900 mb-2"></h3>
      <p id="modal-message" class="text-gray-600 mb-6 whitespace-pre-line"></p>
      <button onclick="fermerModal()" class="w-full py-2 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition-colors">
        OK
      </button>
    </div>
  </div>
 
  <script>
    function montrerModal(titre, message) {
      document.getElementById('modal-title').textContent = titre;
      document.getElementById('modal-message').textContent = message;
      document.getElementById('modal').classList.remove('hidden');
    }
 
    function fermerModal() {
      document.getElementById('modal').classList.add('hidden');
    }
 
    function connecterAvecGoogle() {
      montrerModal(
        '✅ Connexion Google',
        'Redirection vers Google en cours...\n\nDans une vraie application, cela vous redirigerait vers la page de connexion Google.'
      );
      setTimeout(() => {
        window.location.href = 'feed.html';
      }, 2000);
    }
 
    function connecterAvecFacebook() {
      montrerModal(
        '✅ Connexion Facebook',
        'Redirection vers Facebook en cours...\n\nDans une vraie application, cela vous redirigerait vers la page de connexion Facebook.'
      );
      setTimeout(() => {
        window.location.href = 'feed.html';
      }, 2000);
    }
 
    function connecterAvecEmail() {
      const email = document.getElementById('email').value;
      montrerModal(
        '✅ Connexion réussie',
        `Bienvenue ${email} !\n\nVous allez être redirigé vers votre flux d'actualité.`
      );
      setTimeout(() => {
        window.location.href = 'feed.html';
      }, 1500);
    }
 
    // Fermer le modal en cliquant en dehors
    document.getElementById('modal').addEventListener('click', function(e) {
      if (e.target === this) {
        fermerModal();
      }
    });
  </script>
</body>
</html>
