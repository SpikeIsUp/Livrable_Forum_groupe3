<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion Google — SportForum</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .spinner { width:40px; height:40px; border:4px solid #e5e7eb; border-top-color:#4285F4; border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .step { display:flex; align-items:center; gap:12px; padding:12px; border-radius:10px; }
    .step.done { opacity:1; }
    .step.pending { opacity:0.4; }
    .step-icon { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  </style>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-10 max-w-sm w-full text-center">
    <svg class="w-12 h-12 mx-auto mb-6" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>

    <h2 class="text-xl font-bold text-gray-900 mb-1">Connexion avec Google</h2>
    <p class="text-gray-500 text-sm mb-8">Choisissez votre compte Google</p>

    <!-- Faux écran de sélection de compte Google -->
    <div id="account-picker" class="text-left space-y-2 mb-6">
      <p class="text-xs text-gray-400 font-medium mb-3 uppercase tracking-wide">Sélectionnez un compte</p>
      <button onclick="selectAccount('Jean Sportif', 'jean.sportif@gmail.com')" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-gray-50 border border-gray-200 transition-colors">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-red-400 to-orange-400 flex items-center justify-center text-white font-bold">J</div>
        <div class="text-left">
          <p class="font-semibold text-gray-900 text-sm">Jean Sportif</p>
          <p class="text-xs text-gray-500">jean.sportif@gmail.com</p>
        </div>
        <svg class="ml-auto text-gray-400" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button onclick="selectAccount('Marie Runner', 'marie.runner@gmail.com')" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-gray-50 border border-gray-200 transition-colors">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-400 to-cyan-400 flex items-center justify-center text-white font-bold">M</div>
        <div class="text-left">
          <p class="font-semibold text-gray-900 text-sm">Marie Runner</p>
          <p class="text-xs text-gray-500">marie.runner@gmail.com</p>
        </div>
        <svg class="ml-auto text-gray-400" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button onclick="showNewAccountForm()" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-gray-50 border border-dashed border-gray-300 transition-colors text-gray-500">
        <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 font-bold text-lg">+</div>
        <span class="text-sm font-medium">Utiliser un autre compte</span>
      </button>
    </div>

    <!-- Formulaire autre compte -->
    <div id="new-account-form" class="hidden text-left mb-6">
      <p class="text-xs text-gray-400 font-medium mb-3 uppercase tracking-wide">Entrez votre email Google</p>
      <input id="google-email" type="email" placeholder="exemple@gmail.com" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 mb-3" />
      <button onclick="continueWithEmail()" class="w-full bg-blue-600 text-white py-2.5 rounded-xl font-semibold hover:bg-blue-700 transition-colors text-sm">Continuer</button>
      <button onclick="document.getElementById('new-account-form').classList.add('hidden'); document.getElementById('account-picker').classList.remove('hidden')" class="w-full mt-2 text-gray-500 text-sm hover:text-gray-700">← Retour</button>
    </div>

    <!-- Loading state -->
    <div id="loading" class="hidden">
      <div class="spinner mx-auto mb-6"></div>
      <div class="space-y-2 text-left">
        <div class="step done" id="step1"><div class="step-icon bg-green-100">✅</div><span class="text-sm text-gray-700">Vérification du compte Google</span></div>
        <div class="step pending" id="step2"><div class="step-icon bg-gray-100">🔐</div><span class="text-sm text-gray-700">Authentification sécurisée</span></div>
        <div class="step pending" id="step3"><div class="step-icon bg-gray-100">🎉</div><span class="text-sm text-gray-700">Connexion à SportForum</span></div>
      </div>
    </div>

    <p class="text-xs text-gray-400 mt-4">En continuant, vous acceptez les <a href="#" class="underline">CGU</a> de SportForum</p>
  </div>

  <script>
    function selectAccount(name, email) {
      loginWithGoogle(name, email);
    }

    function showNewAccountForm() {
      document.getElementById('account-picker').classList.add('hidden');
      document.getElementById('new-account-form').classList.remove('hidden');
    }

    function continueWithEmail() {
      const email = document.getElementById('google-email').value.trim();
      if (!email) return;
      const name = email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      loginWithGoogle(name, email);
    }

    function loginWithGoogle(name, email) {
      document.getElementById('account-picker').classList.add('hidden');
      document.getElementById('new-account-form').classList.add('hidden');
      document.getElementById('loading').classList.remove('hidden');

      setTimeout(() => {
        document.getElementById('step2').classList.remove('pending');
        document.getElementById('step2').classList.add('done');
        document.getElementById('step2').querySelector('.step-icon').textContent = '✅';
      }, 800);

      setTimeout(() => {
        document.getElementById('step3').classList.remove('pending');
        document.getElementById('step3').classList.add('done');
        document.getElementById('step3').querySelector('.step-icon').textContent = '✅';
      }, 1600);

      setTimeout(() => {
        const user = { username: name, email, provider: 'google' };
        // Sauvegarder dans les comptes si nouveau
        const accounts = JSON.parse(localStorage.getItem('sportforum_accounts') || '[]');
        if (!accounts.find(a => a.email === email)) {
          accounts.push({ ...user, password: null, createdAt: new Date().toISOString() });
          localStorage.setItem('sportforum_accounts', JSON.stringify(accounts));
        }
        localStorage.setItem('sportforum_user', JSON.stringify(user));
        window.location.href = 'feed.html';
      }, 2400);
    }
  </script>
</body>
</html>
