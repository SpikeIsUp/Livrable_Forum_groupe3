<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion Facebook — SportForum</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .spinner { width:40px; height:40px; border:4px solid #e5e7eb; border-top-color:#1877F2; border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .step { display:flex; align-items:center; gap:12px; padding:12px; border-radius:10px; }
    .step.done { opacity:1; }
    .step.pending { opacity:0.4; }
    .step-icon { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  </style>
</head>
<body class="min-h-screen bg-[#1877F2] flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl p-10 max-w-sm w-full text-center">
    <svg class="w-12 h-12 mx-auto mb-6" fill="#1877F2" viewBox="0 0 24 24">
      <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
    </svg>

    <h2 class="text-xl font-bold text-gray-900 mb-1">Connexion avec Facebook</h2>
    <p class="text-gray-500 text-sm mb-8">Connectez-vous avec votre compte Facebook</p>

    <div id="login-form">
      <div class="space-y-4 mb-6 text-left">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email ou numéro de téléphone</label>
          <input id="fb-email" type="text" placeholder="email@exemple.com" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
          <input id="fb-password" type="password" placeholder="••••••••" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <p id="fb-error" class="text-red-500 text-xs hidden">Veuillez remplir tous les champs.</p>
      </div>

      <button onclick="loginWithFacebook()" class="w-full bg-[#1877F2] text-white py-3 rounded-xl font-bold hover:bg-[#1565d8] transition-colors mb-4">
        Se connecter
      </button>
      <a href="#" class="block text-blue-600 text-sm hover:underline mb-6">Mot de passe oublié ?</a>

      <div class="border-t border-gray-200 pt-5">
        <a href="inscription.html" class="inline-block bg-green-500 text-white py-2.5 px-6 rounded-xl font-bold hover:bg-green-600 transition-colors text-sm">
          Créer un nouveau compte
        </a>
      </div>
    </div>

    <!-- Loading -->
    <div id="fb-loading" class="hidden">
      <div class="spinner mx-auto mb-6"></div>
      <div class="space-y-2 text-left">
        <div class="step done"><div class="step-icon bg-green-100">✅</div><span class="text-sm text-gray-700">Vérification Facebook</span></div>
        <div class="step pending" id="fb-step2"><div class="step-icon bg-gray-100">🔐</div><span class="text-sm text-gray-700">Autorisation d'accès</span></div>
        <div class="step pending" id="fb-step3"><div class="step-icon bg-gray-100">🎉</div><span class="text-sm text-gray-700">Connexion à SportForum</span></div>
      </div>
    </div>

    <p class="text-xs text-gray-400 mt-6">En continuant, vous acceptez les <a href="#" class="underline">CGU</a> de SportForum</p>
  </div>

  <script>
    function loginWithFacebook() {
      const email = document.getElementById('fb-email').value.trim();
      const password = document.getElementById('fb-password').value;
      if (!email || !password) {
        document.getElementById('fb-error').classList.remove('hidden');
        return;
      }
      document.getElementById('fb-error').classList.add('hidden');
      document.getElementById('login-form').classList.add('hidden');
      document.getElementById('fb-loading').classList.remove('hidden');

      setTimeout(() => {
        document.getElementById('fb-step2').classList.remove('pending');
        document.getElementById('fb-step2').classList.add('done');
        document.getElementById('fb-step2').querySelector('.step-icon').textContent = '✅';
      }, 900);
      setTimeout(() => {
        document.getElementById('fb-step3').classList.remove('pending');
        document.getElementById('fb-step3').classList.add('done');
        document.getElementById('fb-step3').querySelector('.step-icon').textContent = '✅';
      }, 1800);
      setTimeout(() => {
        const name = email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        const user = { username: name, email, provider: 'facebook' };
        const accounts = JSON.parse(localStorage.getItem('sportforum_accounts') || '[]');
        if (!accounts.find(a => a.email === email)) {
          accounts.push({ ...user, password: null, createdAt: new Date().toISOString() });
          localStorage.setItem('sportforum_accounts', JSON.stringify(accounts));
        }
        localStorage.setItem('sportforum_user', JSON.stringify(user));
        window.location.href = 'feed.html';
      }, 2700);
    }
  </script>
</body>
</html>
